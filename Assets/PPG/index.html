
<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>people playground.</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <style>
      #xp-loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 260px;
        background: #ece9d8;
        border: 2px solid #3a6ea5;
        box-shadow: 0 0 0 3px #ffffff inset;
        font-family: Tahoma, sans-serif;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #xp-loader-title {
        background: linear-gradient(#2b74c7, #1a4a9c);
        color: white;
        padding: 4px 8px;
        font-size: 14px;
      }
      #xp-loader-bar {
        width: 100%;
        height: 18px;
        border: 1px solid #3a6ea5;
        background: white;
        overflow: hidden;
      }
      #xp-loader-fill {
        width: 0%;
        height: 100%;
        background: #4a8be0;
      }
      #unity-loading-bar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="xp-loader">
      <div id="xp-loader-title">Loading..</div>
      <div id="xp-loader-bar"><div id="xp-loader-fill"></div></div>
      <div id="xp-loader-text">0%</div>
    </div>

    <div id="unity-container">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var xpBox = document.querySelector("#xp-loader");
      var xpFill = document.querySelector("#xp-loader-fill");
      var xpText = document.querySelector("#xp-loader-text");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var PARTS = {
        "pggbog.data": [19922944,19922944,19922944,19922944,19922944,19922944,60724],
        "pggbog.wasm": [19922944,19922944,16241722]
      };
      var TOTAL = 0, LOADED = 0;
      Object.keys(PARTS).forEach(function (k) { PARTS[k].forEach(function (n) { TOTAL += n; }); });

      function setProgress(p, label) {
        xpFill.style.width = p + "%";
        xpText.textContent = (label ? label + " " : "") + p + "%";
      }

      async function fetchPart(url) {
        var res = await fetch(url);
        if (!res.ok) throw new Error("Could not load " + url + " (" + res.status + ")");
        var reader = res.body.getReader();
        var chunks = [];
        while (true) {
          var r = await reader.read();
          if (r.done) break;
          chunks.push(r.value);
          LOADED += r.value.length;
          setProgress(Math.min(100, Math.round(LOADED / TOTAL * 100)), "Downloading");
        }
        return chunks;
      }

      async function mergeFile(name, type) {
        var count = PARTS[name].length;
        var jobs = [];
        for (var i = 1; i <= count; i++) jobs.push(fetchPart(name + ".part" + i));
        var results = await Promise.all(jobs);
        var blobParts = [];
        results.forEach(function (chunks) { blobParts = blobParts.concat(chunks); });
        return URL.createObjectURL(new Blob(blobParts, { type: type }));
      }

      var loaderUrl = "pggbog.loader.js";

      async function start() {
        var dataUrl, codeUrl;
        try {
          dataUrl = await mergeFile("pggbog.data", "application/octet-stream");
          codeUrl = await mergeFile("pggbog.wasm", "application/wasm");
        } catch (e) {
          alert(e.message || e);
          return;
        }
        setProgress(0, "Starting");
        var config = {
          dataUrl: dataUrl,
          frameworkUrl: "pggbog.framework.js",
          codeUrl: codeUrl,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Studio Minus",
          productName: "People Playground",
          productVersion: "1",
          showBanner: unityShowBanner
        };
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            setProgress(Math.round(progress * 100), "Starting");
          }).then(function () {
            xpBox.style.display = "none";
          }).catch(function (message) {
            alert(message);
          });
        };
        document.body.appendChild(script);
      }

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      start();
    </script>
  </body>
</html>
