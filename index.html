<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cheeset's web stash</title>
<meta name="description" content="Cheeset's web stash">
<meta name="theme-color" content="#0d1522">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d1522'/%3E%3Cpath d='M20 16v10M32 24v14M44 14v12M26 36v12M40 40v10' stroke='%238fb8d8' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#e8eef6;
    --ink-soft:#9fb0c4;
    --night:#0b121e;
    --dusk:#142033;
    --pane:#1b2b42;
    --mist:#8fb8d8;
    --lilac:#a99bd0;
    --moss:#7fb5a6;
    --radius:22px;
    --display:"Fraunces", Georgia, "Times New Roman", serif;
    --ui:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:var(--ui);
    color:var(--ink);
    background:linear-gradient(180deg,#0b121e 0%,#101b2c 55%,#16263b 100%) fixed;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  #rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .fog{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(60px);opacity:.55}
  .fog i{position:absolute;border-radius:50%;display:block}
  .fog i:nth-child(1){width:55vmax;height:40vmax;left:-10%;top:5%;background:radial-gradient(closest-side,rgba(88,128,170,.55),transparent);animation:fog1 38s ease-in-out infinite alternate}
  .fog i:nth-child(2){width:50vmax;height:38vmax;right:-8%;top:30%;background:radial-gradient(closest-side,rgba(130,112,184,.4),transparent);animation:fog2 46s ease-in-out infinite alternate}
  .fog i:nth-child(3){width:60vmax;height:30vmax;left:20%;bottom:-12%;background:radial-gradient(closest-side,rgba(78,140,128,.35),transparent);animation:fog1 52s ease-in-out infinite alternate-reverse}
  @keyframes fog1{to{transform:translate3d(8vw,4vh,0) scale(1.15)}}
  @keyframes fog2{to{transform:translate3d(-9vw,-5vh,0) scale(1.1)}}

  .wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:clamp(28px,6vw,72px) clamp(18px,4vw,40px) 120px}

  header{text-align:center;margin-bottom:clamp(28px,5vw,52px)}
  h1{
    font-family:var(--display);
    font-weight:300;
    font-size:clamp(2.4rem,7vw,4.6rem);
    letter-spacing:-.02em;
    line-height:1.05;
    margin:0;
    text-shadow:0 0 40px rgba(143,184,216,.35);
    animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both;
  }
  .sub{
    font-family:var(--display);
    font-style:italic;
    font-weight:300;
    color:var(--ink-soft);
    font-size:clamp(1rem,2.2vw,1.25rem);
    margin:.7rem 0 0;
    animation:rise 1.4s .25s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

  .bar{
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
    margin-bottom:26px;
    animation:rise 1.4s .5s cubic-bezier(.2,.7,.2,1) both;
  }
  .tabs{display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(20,32,51,.6);border:1px solid rgba(143,184,216,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .tab{
    appearance:none;border:0;background:transparent;color:var(--ink-soft);
    font:500 .95rem var(--ui);padding:9px 20px;border-radius:999px;cursor:pointer;
    transition:background .3s,color .3s;
  }
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{background:rgba(143,184,216,.18);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(143,184,216,.25)}
  .search{
    flex:0 1 260px;min-width:160px;
    background:rgba(20,32,51,.6);border:1px solid rgba(143,184,216,.14);color:var(--ink);
    padding:11px 18px;border-radius:999px;font:400 .95rem var(--ui);outline:none;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:border-color .3s, box-shadow .3s;
  }
  .search::placeholder{color:#74869b}
  .search:focus{border-color:rgba(143,184,216,.5);box-shadow:0 0 0 4px rgba(143,184,216,.1)}
  .tab:focus-visible,.snd:focus-visible,.card:focus-visible{outline:2px solid var(--mist);outline-offset:3px}

  .grid{
    display:grid;gap:22px;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  }

  /* ---------- panels ---------- */
  .card{
    --h:210;--mx:50%;--my:50%;--rx:0deg;--ry:0deg;--d:0s;
    position:relative;display:block;aspect-ratio:16/10;
    border-radius:var(--radius);overflow:hidden;isolation:isolate;
    color:var(--ink);text-decoration:none;cursor:pointer;
    background:hsl(var(--h) 35% 14%);
    box-shadow:0 18px 40px -18px rgba(0,0,0,.65), inset 0 0 0 1px rgba(190,215,240,.12);
    transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));
    transition:transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .4s;
    -webkit-tap-highlight-color:transparent;
  }
  .card.live{animation:cardIn .9s var(--stagger,0s) cubic-bezier(.2,.7,.2,1) both}
  @keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1}}
  .card:hover{box-shadow:0 26px 50px -18px rgba(0,0,0,.75), 0 0 40px -8px hsl(var(--h) 60% 55% / .35), inset 0 0 0 1px rgba(190,215,240,.28)}
  .card .bg{
    position:absolute;inset:-35%;z-index:-3;
    background:
      radial-gradient(55% 55% at 28% 30%, hsl(var(--h) 55% 46% / .9), transparent 70%),
      radial-gradient(50% 50% at 76% 72%, hsl(calc(var(--h) + 55) 50% 42% / .85), transparent 70%),
      radial-gradient(40% 40% at 70% 20%, hsl(calc(var(--h) - 40) 45% 50% / .55), transparent 70%),
      linear-gradient(135deg, hsl(var(--h) 40% 20%), hsl(calc(var(--h) + 30) 45% 12%));
    animation:drift 16s ease-in-out infinite alternate;
    animation-delay:var(--d);
  }
  @keyframes drift{
    from{transform:translate3d(-5%,-4%,0) rotate(0deg) scale(1.02)}
    to{transform:translate3d(5%,4%,0) rotate(8deg) scale(1.14)}
  }
  .card .cover{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;
    opacity:.55;filter:saturate(.85) brightness(.85);
    transition:opacity .5s, transform 1.2s;
  }
  .card:hover .cover{opacity:.75;transform:scale(1.05)}
  .card .initial{
    position:absolute;right:-.06em;top:-.22em;z-index:-1;
    font:300 9.5rem/1 var(--display);color:rgba(255,255,255,.09);
    user-select:none;pointer-events:none;
  }
  .card .rain{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none;opacity:.55;transition:opacity .4s}
  .card:hover .rain{opacity:1}
  .card .rain::before{
    content:"";position:absolute;left:0;right:0;top:-200px;height:calc(100% + 200px);
    background:
      linear-gradient(to bottom,transparent,rgba(205,225,255,.55),transparent) 9% 0/1px 100px repeat-y,
      linear-gradient(to bottom,transparent,rgba(205,225,255,.4),transparent) 23% 30px/1px 50px repeat-y,
      linear-gradient(to bottom,transparent,rgba(205,225,255,.5),transparent) 38% 10px/1px 200px repeat-y,
      linear-gradient(to bottom,transparent,rgba(205,225,255,.35),transparent) 52% 60px/1px 40px repeat-y,
      linear-gradient(to bottom,transparent,rgba(205,225,255,.5),transparent) 67% 20px/1px 100px repeat-y,
      linear-gradient(to bottom,transparent,rgba(205,225,255,.4),transparent) 81% 70px/1px 50px repeat-y,
      linear-gradient(to bottom,transparent,rgba(205,225,255,.45),transparent) 93% 0/1px 200px repeat-y;
    animation:fall 2.4s linear infinite;
    transform:skewX(-6deg);
  }
  @keyframes fall{to{transform:translateY(200px) skewX(-6deg)}}
  .card::after{
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(260px circle at var(--mx) var(--my), rgba(255,255,255,.16), transparent 60%);
    opacity:0;transition:opacity .35s;
  }
  .card:hover::after{opacity:1}
  .card .label{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    padding:46px 18px 16px;
    background:linear-gradient(to top, rgba(6,10,18,.82), rgba(6,10,18,.45) 55%, transparent);
    display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  }
  .card .name{
    font:500 1.2rem/1.2 var(--display);letter-spacing:-.005em;
    text-shadow:0 2px 14px rgba(0,0,0,.6);
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;
  }
  .card .play{
    flex:none;width:36px;height:36px;border-radius:50%;
    display:grid;place-items:center;
    background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    opacity:0;transform:translateY(6px) scale(.9);
    transition:opacity .3s, transform .3s;
  }
  .card .play svg{width:14px;height:14px;fill:#fff;margin-left:2px}
  .card:hover .play,.card:focus-visible .play{opacity:1;transform:none}
  @media (hover:none){.card .play{opacity:.85;transform:none}}

  .skeleton{
    aspect-ratio:16/10;border-radius:var(--radius);
    background:linear-gradient(110deg,rgba(27,43,66,.6) 30%,rgba(60,88,124,.35) 50%,rgba(27,43,66,.6) 70%) 0 0/250% 100%;
    animation:shimmer 2.2s linear infinite;
    border:1px solid rgba(143,184,216,.08);
  }
  @keyframes shimmer{to{background-position:-150% 0}}

  .note{
    text-align:center;color:var(--ink-soft);
    max-width:520px;margin:50px auto;line-height:1.6;font-size:1.02rem;
  }
  .note h2{font:300 1.7rem var(--display);color:var(--ink);margin:0 0 .5rem}
  .note code{background:rgba(143,184,216,.12);padding:2px 7px;border-radius:6px;font-size:.9em;color:var(--ink)}
  .count{color:var(--ink-soft);font-size:.9rem;min-height:1.2em;margin:0 4px 16px}

  .snd{
    position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:5;
    display:flex;align-items:center;gap:10px;
    background:rgba(20,32,51,.72);border:1px solid rgba(143,184,216,.2);color:var(--ink);
    font:500 .88rem var(--ui);padding:10px 16px;border-radius:999px;cursor:pointer;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:background .3s,border-color .3s;
  }
  .snd:hover{background:rgba(35,55,84,.8)}
  .snd[aria-pressed="true"]{border-color:rgba(143,184,216,.5)}
  .snd .dot{width:8px;height:8px;border-radius:50%;background:#5b6b80;transition:background .3s, box-shadow .3s}
  .snd[aria-pressed="true"] .dot{background:var(--moss);box-shadow:0 0 10px var(--moss)}
  .toast{
    position:fixed;left:50%;bottom:76px;z-index:6;transform:translate(-50%,20px);
    background:rgba(20,32,51,.95);border:1px solid rgba(143,184,216,.3);
    padding:12px 20px;border-radius:14px;font-size:.92rem;max-width:90vw;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .35s, transform .35s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  [hidden]{display:none !important}

  @media (max-width:560px){
    .bar{justify-content:center}
    .search{flex:1 1 100%}
    .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
    .card .initial{font-size:7rem}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
    .card .bg{animation:none}
  }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="fog" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="wrap">
  <header>
    <h1>Cheeset's web stash</h1>
    <p class="sub">please spare me github 😭</p>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist" aria-label="Sections" id="tabs"></div>
    <input class="search" id="search" type="search" placeholder="Search games" aria-label="Search games" autocomplete="off">
  </div>

  <section id="view-games" role="tabpanel">
    <div class="count" id="count" aria-live="polite"></div>
    <div class="grid" id="grid"></div>
    <div class="note" id="note" hidden></div>
  </section>

  <section id="view-movies" role="tabpanel" hidden>
    <div class="note">
      <h2>Movies &amp; shows</h2>
      <p>Nothing here yet. This tab is set up and waiting.</p>
    </div>
  </section>
</div>

<button class="snd" id="snd" aria-pressed="false" type="button"><span class="dot"></span><span id="sndLabel">Rain sound off</span></button>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================================================================
   SETTINGS
   ================================================================ */
// Used only when the site is NOT running on <owner>.github.io/<repo>
// (for example a custom domain). On GitHub Pages these are detected from the URL.
const CONFIG = { owner: 'Cheesetidk', repo: 'Carri' };

// Folder names that count as the game library (any capitalisation, with or without the s).
const GAMES_FOLDER = /^assets?$/i;

// Sections shown as tabs. To turn on Movies & Shows later, set enabled:true
// and the page will scan the matching folder the same way it scans games.
const SECTIONS = [
  { id: 'games',  label: 'Games',          folder: GAMES_FOLDER,           enabled: true  },
  { id: 'movies', label: 'Movies & Shows', folder: /^(movies|shows)$/i,    enabled: false },
];

const CACHE_KEY = 'cws-tree-v1';
const CACHE_MS  = 5 * 60 * 1000;

/* ================================================================
   HELPERS
   ================================================================ */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = (p) => p.split('/').map(encodeURIComponent).join('/');
const BASE = new URL('./', location.href).href;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function repoInfo() {
  const h = location.hostname;
  if (h.endsWith('.github.io')) {
    const owner = h.split('.')[0];
    const seg = location.pathname.split('/').filter(Boolean)[0];
    const repo = (seg && !/\.[a-z0-9]+$/i.test(seg)) ? seg : `${owner}.github.io`;
    return { owner, repo };
  }
  return CONFIG;
}

function pretty(s) {
  s = s.replace(/\.html?$/i, '').replace(/[_\-.]+/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/\s+/g, ' ').trim();
  return s.split(' ').map(w => w ? w[0].toUpperCase() + w.slice(1) : w).join(' ') || 'Untitled';
}
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 4200);
}

/* ================================================================
   FINDING THE GAMES (reads the repo's file list, so new games appear on their own)
   ================================================================ */
async function fetchRepoPaths() {
  const { owner, repo } = repoInfo();
  let lastErr;
  for (const ref of ['HEAD', 'main', 'master']) {
    try {
      const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${ref}?recursive=1`, { headers: { Accept: 'application/vnd.github+json' } });
      if (!r.ok) { lastErr = new Error('GitHub answered ' + r.status); if (r.status === 403 || r.status === 429) break; continue; }
      const j = await r.json();
      return j.tree.filter(t => t.type === 'blob').map(t => t.path);
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('Could not reach GitHub');
}

async function getPaths() {
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch {}
  if (cached && Date.now() - cached.t < CACHE_MS) return cached.paths;
  try {
    const all = await fetchRepoPaths();
    // keep only what we need so the cache stays small
    const keep = all.filter(p => p.includes('/') && SECTIONS.some(s => s.folder.test(p.split('/')[0])));
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), paths: keep })); } catch {}
    return keep;
  } catch (e) {
    if (cached) return cached.paths;          // fall back to the last good copy
    // optional manual fallback: a games.json file next to index.html
    try {
      const r = await fetch('games.json', { cache: 'no-store' });
      if (r.ok) { const list = await r.json(); return list.map(p => p.replace(/^\/+/, '')); }
    } catch {}
    throw e;
  }
}

const HTML_RX  = /\.html?$/i;
const IMG_RX   = /\.(png|jpe?g|webp|gif|avif)$/i;
const COVER_RX = /(^|\/)(cover|thumb|thumbnail|icon|logo|poster|preview|banner)[^/]*\.(png|jpe?g|webp|gif|avif)$/i;

function buildGames(paths, folderRx) {
  const files = new Set(paths);
  const groups = new Map();
  const games = [];

  for (const p of paths) {
    const parts = p.split('/');
    if (parts.length < 2 || !folderRx.test(parts[0])) continue;
    if (parts.some(x => x.startsWith('.'))) continue;
    const root = parts[0];
    const rest = parts.slice(1);

    if (rest.length === 1) {                       // asset/Game.html
      if (!HTML_RX.test(rest[0])) continue;
      const base = rest[0].replace(HTML_RX, '');
      const sibling = paths.find(q => { const qq = q.split('/'); return qq.length === 2 && qq[0] === root && IMG_RX.test(qq[1]) && qq[1].replace(IMG_RX, '').toLowerCase() === base.toLowerCase(); });
      games.push({ name: pretty(rest[0]), entry: p, cover: sibling || null });
    } else {                                       // asset/Game/...
      const key = root + '/' + rest[0];
      if (!groups.has(key)) groups.set(key, { dir: rest[0], root, list: [] });
      groups.get(key).list.push(rest.slice(1).join('/'));
    }
  }

  for (const [key, g] of groups) {
    const htmls = g.list.filter(f => HTML_RX.test(f));
    if (!htmls.length) continue;
    const byDepth = (a, b) => a.split('/').length - b.split('/').length || a.localeCompare(b);
    const entryRel =
      htmls.find(f => f.toLowerCase() === 'index.html') ||
      htmls.filter(f => !f.includes('/')).sort()[0] ||
      htmls.filter(f => /(^|\/)index\.html?$/i.test(f)).sort(byDepth)[0] ||
      htmls.sort(byDepth)[0];
    const coverRel = g.list.filter(f => COVER_RX.test(f)).sort(byDepth)[0];
    games.push({ name: pretty(g.dir), entry: key + '/' + entryRel, cover: coverRel ? key + '/' + coverRel : null });
  }

  const seen = new Set();
  return games
    .filter(g => !seen.has(g.entry) && seen.add(g.entry))
    .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
}

/* ================================================================
   LAUNCHING (opens an about:blank tab and loads the game inside it)
   ================================================================ */
function launch(game) {
  const url = BASE + enc(game.entry);
  const w = window.open('about:blank', '_blank');
  if (!w) { toast('Your browser blocked the pop-up. Allow pop-ups for this site and try again.'); return; }
  const d = w.document;
  d.open();
  d.write(
    '<!doctype html><html><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<title>' + esc(game.name) + '</title>' +
    '<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style>' +
    '</head><body><iframe src="' + esc(url) + '" allow="fullscreen; autoplay; gamepad; clipboard-write; microphone; camera" allowfullscreen></iframe></body></html>'
  );
  d.close();
}

/* ================================================================
   PANELS
   ================================================================ */
const grid = $('#grid');
let allCards = [];

function makeCard(game, i) {
  const h = hash(game.name) % 360;
  const a = document.createElement('a');
  a.className = 'card live';
  a.href = BASE + enc(game.entry);
  a.dataset.name = game.name.toLowerCase();
  a.style.setProperty('--h', h);
  a.style.setProperty('--d', (-(hash(game.name + 'd') % 14)) + 's');
  a.style.setProperty('--stagger', Math.min(i, 14) * 0.05 + 's');
  a.setAttribute('aria-label', 'Open ' + game.name);
  a.innerHTML =
    '<div class="bg"></div>' +
    (game.cover ? '<img class="cover" alt="" loading="lazy" src="' + esc(BASE + enc(game.cover)) + '">' : '') +
    '<div class="initial">' + esc(game.name.trim()[0] || '?') + '</div>' +
    '<div class="rain"></div>' +
    '<div class="label"><span class="name">' + esc(game.name) + '</span>' +
    '<span class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span></div>';

  const img = a.querySelector('.cover');
  if (img) img.addEventListener('error', () => img.remove());

  a.addEventListener('click', (e) => {
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;
    e.preventDefault(); launch(game);
  });

  a.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse' || reduced) return;
    const r = a.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    a.style.setProperty('--mx', (x * 100) + '%');
    a.style.setProperty('--my', (y * 100) + '%');
    a.style.setProperty('--ry', ((x - .5) * 9) + 'deg');
    a.style.setProperty('--rx', ((.5 - y) * 9) + 'deg');
  });
  a.addEventListener('pointerleave', () => { a.style.setProperty('--rx', '0deg'); a.style.setProperty('--ry', '0deg'); });
  a.addEventListener('animationend', (e) => { if (e.animationName === 'cardIn') a.classList.remove('live'); });
  return a;
}

function showSkeletons() {
  grid.innerHTML = '';
  for (let i = 0; i < 8; i++) { const s = document.createElement('div'); s.className = 'skeleton'; s.style.animationDelay = (i * .12) + 's'; grid.appendChild(s); }
}

function showNote(html) { const n = $('#note'); n.innerHTML = html; n.hidden = false; }
function hideNote() { $('#note').hidden = true; }

function applyFilter() {
  const q = $('#search').value.trim().toLowerCase();
  let shown = 0;
  for (const c of allCards) { const ok = !q || c.dataset.name.includes(q); c.hidden = !ok; if (ok) shown++; }
  const total = allCards.length;
  $('#count').textContent = total ? (q ? `${shown} of ${total} games` : `${total} ${total === 1 ? 'game' : 'games'}`) : '';
  if (total && !shown) showNote('<h2>No match</h2><p>Nothing in the stash matches that search.</p>'); else if (total) hideNote();
}

async function loadGames() {
  showSkeletons(); hideNote();
  try {
    const paths = await getPaths();
    const games = buildGames(paths, GAMES_FOLDER);
    grid.innerHTML = '';
    allCards = games.map(makeCard);
    allCards.forEach(c => grid.appendChild(c));
    if (!games.length) {
      $('#count').textContent = '';
      showNote('<h2>The stash is empty</h2><p>Add a game to the <code>asset</code> folder in the repo. It can be a single <code>.html</code> file or a folder with an <code>index.html</code> inside. Refresh after a minute or two and it will show up here.</p>');
    } else applyFilter();
  } catch (e) {
    grid.innerHTML = ''; $('#count').textContent = '';
    showNote('<h2>Couldn\'t load the stash</h2><p>GitHub didn\'t return the file list (' + esc(e.message || 'network error') + '). This usually clears up within a few minutes. Check that the repo is public, then refresh.</p>');
  }
}

/* ================================================================
   TABS
   ================================================================ */
const tabsEl = $('#tabs');
SECTIONS.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'tab'; b.type = 'button'; b.role = 'tab'; b.dataset.id = s.id;
  b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
  b.textContent = s.label;
  b.addEventListener('click', () => selectTab(s.id));
  tabsEl.appendChild(b);
});
function selectTab(id) {
  tabsEl.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.id === id)));
  $('#view-games').hidden = id !== 'games';
  $('#view-movies').hidden = id !== 'movies';
  $('#search').hidden = id !== 'games';
}
$('#search').addEventListener('input', applyFilter);

/* ================================================================
   RAIN
   ================================================================ */
(function rain() {
  const c = $('#rain'), ctx = c.getContext('2d');
  let W, H, dpr, drops = [], ripples = [], last = performance.now(), running = true;
  const WIND = 0.14;

  function mk(initial) {
    const z = Math.random();
    return { x: Math.random() * (W + 240) - 120, y: initial ? Math.random() * H : -30, z,
             len: 10 + z * 24, v: 420 + z * 760, a: .07 + z * .22, land: H * (.62 + .36 * z) + Math.random() * 20 };
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(W * H / (reduced ? 22000 : 8000));
    drops = Array.from({ length: Math.min(n, 260) }, () => mk(true));
  }
  function frame(t) {
    if (!running) return;
    const dt = Math.min((t - last) / 1000, .05); last = t;
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = 'round';
    for (const d of drops) {
      d.y += d.v * dt; d.x += d.v * WIND * dt;
      if (d.y >= d.land) {
        if (d.z > .35 && ripples.length < 70 && !reduced) ripples.push({ x: d.x, y: d.y, r: 1, max: 14 + d.z * 26, a: .2 * d.z + .05 });
        Object.assign(d, mk(false));
        continue;
      }
      ctx.strokeStyle = `rgba(178,207,235,${d.a})`;
      ctx.lineWidth = .5 + d.z * 1.1;
      ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.len * WIND, d.y - d.len); ctx.stroke();
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i]; r.r += (r.max / 1.1) * dt;
      const k = r.r / r.max; if (k >= 1) { ripples.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(178,207,235,${r.a * (1 - k)})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r * .32, 0, 0, Math.PI * 2); ctx.stroke();
    }
    requestAnimationFrame(frame);
  }
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    running = !document.hidden;
    if (running) { last = performance.now(); requestAnimationFrame(frame); }
  });
  resize(); requestAnimationFrame(frame);
})();

/* ================================================================
   RAIN SOUND (made in the browser, no audio files needed)
   ================================================================ */
(function sound() {
  const btn = $('#snd'), label = $('#sndLabel');
  let ac, master, on = false;

  function build() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);

    const len = ac.sampleRate * 5;
    const body = ac.createBuffer(2, len, ac.sampleRate);
    const patter = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const b = body.getChannelData(ch), p = patter.getChannelData(ch);
      let last = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        last = (last + 0.02 * w) / 1.02; b[i] = last * 3.2;
        p[i] = w * (Math.random() < .08 ? 1 : .25);
      }
      // fade the loop seam so it doesn't click
      const f = 2000;
      for (let i = 0; i < f; i++) { const k = i / f; b[i] *= k; b[len - 1 - i] *= k; p[i] *= k; p[len - 1 - i] *= k; }
    }
    const mkSrc = (buf, filters, gainVal) => {
      const s = ac.createBufferSource(); s.buffer = buf; s.loop = true;
      let node = s; filters.forEach(f => { node.connect(f); node = f; });
      const g = ac.createGain(); g.gain.value = gainVal; node.connect(g); g.connect(master); s.start();
      return g;
    };
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 5200; bp.Q.value = .6;
    mkSrc(body, [lp], .9);
    const pg = mkSrc(patter, [bp], .12);

    // slow swell so it breathes a little
    const lfo = ac.createOscillator(), lg = ac.createGain();
    lfo.frequency.value = .07; lg.gain.value = .03; lfo.connect(lg); lg.connect(pg.gain); lfo.start();
  }

  btn.addEventListener('click', async () => {
    if (!ac) build();
    if (ac.state === 'suspended') await ac.resume();
    on = !on;
    master.gain.cancelScheduledValues(ac.currentTime);
    master.gain.linearRampToValueAtTime(on ? .32 : 0, ac.currentTime + 1.6);
    btn.setAttribute('aria-pressed', String(on));
    label.textContent = on ? 'Rain sound on' : 'Rain sound off';
  });
})();

/* ================================================================ */
selectTab('games');
loadGames();
